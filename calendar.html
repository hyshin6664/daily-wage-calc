<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>달력 일용직 급여계산기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.svg">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--line:#e5e7eb;--ink:#111827;--sub:#6b7280;--pri:#2563eb;--bg:#f8fafc;--pos:#059669}
  *{box-sizing:border-box}
  body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .ver{font-size:12px;color:var(--sub);background:#f1f5f9;border-radius:10px;padding:2px 8px;cursor:pointer}
  header .spacer{flex:1}
  header a.back, header button, header label.btn{
    font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--ink)
  }
  header a.back:hover, header button:hover, header label.btn:hover{background:#f1f5f9}
  header button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  header button.pri:hover{background:#1d4ed8}
  header input[type=file]{display:none}

  .wrap{max-width:1180px;margin:18px auto;padding:0 16px}
  .meta{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .meta .f{display:flex;flex-direction:column;gap:4px}
  .meta label{font-size:12px;color:var(--sub)}
  .meta input,.meta select{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:140px}
  .meta .note{font-size:12px;color:var(--sub);margin-left:auto;text-align:right;line-height:1.5}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--sub)}
  .empty button{margin-top:12px;font-family:inherit;font-size:14px;background:var(--pri);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card .head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .card .head input.name{flex:0 0 140px;font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-weight:600}
  .card .head .f{display:flex;flex-direction:column;gap:2px}
  .card .head .f label{font-size:11px;color:var(--sub)}
  .card .head input.num{font-family:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;width:90px;text-align:right;font-variant-numeric:tabular-nums}
  .card .head .chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;background:#f1f5f9;padding:6px 10px;border-radius:6px}
  .card .head .chk input{width:16px;height:16px;cursor:pointer}
  .card .head .del{margin-left:auto;background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1}
  .card .head .del:hover{background:#fecaca}

  .body{display:grid;grid-template-columns:1fr 280px;gap:16px}
  @media (max-width:760px){.body{grid-template-columns:1fr}}

  .cal{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cal .hdr{display:grid;grid-template-columns:repeat(7,1fr);background:#f1f5f9;font-size:12px;color:#475569;font-weight:600}
  .cal .hdr div{padding:6px 0;text-align:center;border-right:1px solid var(--line)}
  .cal .hdr div:last-child{border-right:none}
  .cal .hdr div.sun{color:#dc2626}
  .cal .hdr div.sat{color:#2563eb}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal .day{aspect-ratio:1.1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:#fff;position:relative;transition:background .1s}
  .cal .day:nth-child(7n){border-right:none}
  .cal .day.empty{background:#fafbfc;cursor:default}
  .cal .day.sun{color:#dc2626}
  .cal .day.sat{color:#2563eb}
  .cal .day.work{background:#dbeafe;font-weight:700}
  .cal .day.work::after{content:"✓";position:absolute;bottom:2px;right:4px;color:var(--pri);font-weight:700;font-size:14px}
  .cal .day:hover:not(.empty){background:#eff6ff}
  .cal .day.work:hover{background:#bfdbfe}

  .summary{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
  .summary .row{display:flex;justify-content:space-between}
  .summary .row .l{color:var(--sub)}
  .summary .row .v{font-variant-numeric:tabular-nums;font-weight:600}
  .summary .row.gross{padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
  .summary .row.net{padding-top:8px;border-top:2px solid var(--pri);margin-top:6px;font-size:15px}
  .summary .row.net .v{color:var(--pri)}

  .total-bar{background:#0f172a;color:#fff;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:10px}
  .total-bar .l{font-size:14px;color:#cbd5e1}
  .total-bar .nums{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .total-bar .nums .it .lbl{font-size:11px;color:#94a3b8;display:block}
  .total-bar .nums .it .vl{font-size:16px;font-weight:700}
  .total-bar .nums .it.net .vl{color:#34d399}

  .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .actions button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
  .actions button:hover{background:#f1f5f9}
  .actions button.add{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .actions button.add:hover{background:#d1fae5}

  footer.credit{text-align:right;padding:16px 22px 24px;color:#94a3b8;font-size:11px}

  @media print{
    @page{size:A4 portrait;margin:10mm}
    body{background:#fff}
    header,.actions,.card .head .del,.card .head .chk,#fileInput{display:none !important}
    .card{break-inside:avoid;border:1px solid #000}
    .cal .day{cursor:default}
    .total-bar{background:#fff;color:#000;border:2px solid #000}
    .total-bar .nums .it .lbl{color:#555}
    .total-bar .nums .it.net .vl{color:#000}
    footer.credit{position:fixed;bottom:4mm;right:8mm;color:#888;font-size:9px}
  }
</style>
</head>
<body>

<header>
  <a href="./" class="back">← 월간 계산기</a>
  <h1>달력 일용직 계산기</h1>
  <span class="ver" id="verBtn" title="업데이트 내역">v2.0.0</span>
  <div class="spacer"></div>
  <button id="addBtn" class="pri">+ 인원 추가</button>
  <button id="expBtn">엑셀 다운로드</button>
  <label class="btn" for="fileInput">엑셀 불러오기</label>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <button id="printBtn">인쇄(A4)</button>
</header>

<div class="wrap">

  <div class="meta">
    <div class="f">
      <label>계산 연월</label>
      <input type="month" id="ym">
    </div>
    <div class="f">
      <label>기본 시급(원)</label>
      <input type="number" id="defRate" value="10320" min="0" step="10">
    </div>
    <div class="f">
      <label>1일 근무시간</label>
      <input type="number" id="defHpd" value="8" min="0.5" max="12" step="0.5">
    </div>
    <div class="note">
      2026년 최저시급 기본값 10,320원 · 세금 = 소득세 3% + 지방세 0.3% (각 10원 미만 버림)<br>
      주휴수당 = 한 주(월~일) 근무시간 <b>15h 이상</b>일 때 8h 가산 (인원별 토글)
    </div>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button class="add" id="addBtn2">+ 인원 추가</button>
    <button id="clearBtn">전체 삭제</button>
  </div>

  <div class="total-bar" id="totalBar" style="display:none">
    <div class="l">전체 합계</div>
    <div class="nums">
      <div class="it"><span class="lbl">인원</span><span class="vl" id="tCount">0</span></div>
      <div class="it"><span class="lbl">총 시간</span><span class="vl" id="tHours">0</span></div>
      <div class="it"><span class="lbl">세전급여</span><span class="vl" id="tGross">0</span></div>
      <div class="it"><span class="lbl">공제합계</span><span class="vl" id="tDeduct">0</span></div>
      <div class="it net"><span class="lbl">차인지급액</span><span class="vl" id="tNet">0</span></div>
    </div>
  </div>

</div>

<footer class="credit">CDN &amp; Cloud is by Solbox..</footer>

<script>
const VER = "v2.0.0";
const UPDATE_HISTORY = [
  ["v2.0.0","2026-05-07","달력 일용직 계산기 신규 — 날짜 클릭 토글, 최저시급 기본, 주 15h+ 주휴수당 옵션"]
];

let people = []; // {name, rate, hpd, applyWeekHoliday, days:Set("YYYY-MM-DD")}

const $ = id => document.getElementById(id);
const fmt = n => (Number(n)||0).toLocaleString("ko-KR");
const floor10 = n => Math.floor(n/10)*10;
const pad = n => String(n).padStart(2,"0");
const todayYM = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymFirst = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1); };
const ymLast = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0); };
const DOW = ["일","월","화","수","목","금","토"];

/* ─────────────── 계산 ─────────────── */
function calcPerson(p){
  const ym = $("ym").value;
  const rate = Number(p.rate)||0;
  const hpd = Number(p.hpd)||0;
  const days = [...p.days].filter(d => d.startsWith(ym)).sort();
  const workDays = days.length;
  const workHours = workDays * hpd;

  // 주휴: 한 주(월~일) 근무시간 합 15h+ 이면 8h 가산
  let weekHoliday = 0;
  if(p.applyWeekHoliday && workDays>0){
    const weekHours = new Map();
    for(const ds of days){
      const [y,m,d] = ds.split("-").map(Number);
      const dt = new Date(y,m-1,d);
      const dow = dt.getDay();
      const offset = dow===0 ? 6 : dow-1;
      const mon = new Date(dt); mon.setDate(dt.getDate()-offset);
      const k = dateStr(mon);
      weekHours.set(k, (weekHours.get(k)||0) + hpd);
    }
    for(const [,h] of weekHours){
      if(h >= 15) weekHoliday += 8;
    }
  }
  const totalHours = workHours + weekHoliday;
  const gross = Math.round(totalHours * rate);
  const incomeTax = floor10(gross * 0.03);
  const localTax  = floor10(gross * 0.003);
  const deduct = incomeTax + localTax;
  const net = gross - deduct;
  return {workDays, workHours, weekHoliday, totalHours, gross, incomeTax, localTax, deduct, net};
}

/* ─────────────── 달력 렌더 ─────────────── */
function renderCalendar(p){
  const ym = $("ym").value;
  const first = ymFirst(ym), last = ymLast(ym);
  const startDow = first.getDay(); // 0:일
  let html = `<div class="hdr">
    <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
  </div><div class="grid">`;
  for(let i=0;i<startDow;i++) html += `<div class="day empty"></div>`;
  for(let d=1; d<=last.getDate(); d++){
    const ds = `${ym}-${pad(d)}`;
    const dt = new Date(first.getFullYear(), first.getMonth(), d);
    const dow = dt.getDay();
    const cls = ["day"];
    if(dow===0) cls.push("sun");
    if(dow===6) cls.push("sat");
    if(p.days.has(ds)) cls.push("work");
    html += `<div class="${cls.join(" ")}" data-d="${ds}">${d}</div>`;
  }
  return html;
}

/* ─────────────── 카드 렌더 ─────────────── */
function renderList(){
  // 포커스 보존
  const ae = document.activeElement;
  let fInfo = null;
  if(ae && ae.tagName==="INPUT" && ae.dataset && ae.dataset.k){
    fInfo = {i: ae.dataset.i, k: ae.dataset.k, start: ae.selectionStart, end: ae.selectionEnd};
  }

  const list = $("list");
  if(people.length===0){
    list.innerHTML = `<div class="empty">
      인원이 없어요.<br>
      <button onclick="addPerson()">+ 인원 추가하기</button>
    </div>`;
    $("totalBar").style.display = "none";
    return;
  }

  let tH=0, tG=0, tD=0, tN=0;
  list.innerHTML = people.map((p,i)=>{
    const c = calcPerson(p);
    tH+=c.totalHours; tG+=c.gross; tD+=c.deduct; tN+=c.net;
    return `
      <div class="card">
        <div class="head">
          <input class="name" data-k="name" data-i="${i}" value="${p.name||""}" placeholder="이름">
          <div class="f"><label>시급(원)</label>
            <input class="num" data-k="rate" data-i="${i}" value="${p.rate||""}" inputmode="numeric"></div>
          <div class="f"><label>1일 시간</label>
            <input class="num" data-k="hpd" data-i="${i}" value="${p.hpd||""}" inputmode="decimal" style="width:60px"></div>
          <label class="chk">
            <input type="checkbox" data-k="awh" data-i="${i}" ${p.applyWeekHoliday?"checked":""}>
            주 15h+ 주휴수당 적용
          </label>
          <button class="del" data-del="${i}" title="삭제">×</button>
        </div>
        <div class="body">
          <div class="cal" data-cal="${i}">${renderCalendar(p)}</div>
          <div class="summary">
            <div class="row"><span class="l">근무일수</span><span class="v">${c.workDays} 일</span></div>
            <div class="row"><span class="l">실근로시간</span><span class="v">${c.workHours} h</span></div>
            <div class="row"><span class="l">주휴시간</span><span class="v">${c.weekHoliday} h</span></div>
            <div class="row gross"><span class="l">세전급여</span><span class="v">${fmt(c.gross)} 원</span></div>
            <div class="row"><span class="l">소득세 3%</span><span class="v">- ${fmt(c.incomeTax)}</span></div>
            <div class="row"><span class="l">지방세 0.3%</span><span class="v">- ${fmt(c.localTax)}</span></div>
            <div class="row"><span class="l">공제합계</span><span class="v">- ${fmt(c.deduct)}</span></div>
            <div class="row net"><span class="l">차인지급액</span><span class="v">${fmt(c.net)} 원</span></div>
          </div>
        </div>
      </div>
    `;
  }).join("");

  $("totalBar").style.display = "flex";
  $("tCount").textContent = people.length;
  $("tHours").textContent = tH;
  $("tGross").textContent = fmt(tG);
  $("tDeduct").textContent = fmt(tD);
  $("tNet").textContent = fmt(tN);

  // 입력 바인딩
  list.querySelectorAll("input[data-k]").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const i=+e.target.dataset.i, k=e.target.dataset.k;
      if(k==="awh") people[i].applyWeekHoliday = e.target.checked;
      else if(k==="rate" || k==="hpd") people[i][k] = e.target.value.replace(/[^\d.]/g,"");
      else people[i][k] = e.target.value;
      renderList();
    });
    inp.addEventListener("change", e=>{
      // 체크박스 변경도 보장
      if(e.target.dataset.k==="awh"){
        people[+e.target.dataset.i].applyWeekHoliday = e.target.checked;
        renderList();
      }
    });
  });
  // 달력 클릭
  list.querySelectorAll(".cal .day:not(.empty)").forEach(d=>{
    d.addEventListener("click", e=>{
      const ds = e.target.dataset.d;
      const i = +e.target.closest(".cal").dataset.cal;
      if(people[i].days.has(ds)) people[i].days.delete(ds);
      else people[i].days.add(ds);
      renderList();
    });
  });
  // 삭제
  list.querySelectorAll("button[data-del]").forEach(b=>{
    b.addEventListener("click", e=>{
      const i = +e.target.dataset.del;
      if(!confirm(`${people[i].name||"이 인원"} 을(를) 삭제할까요?`)) return;
      people.splice(i,1); renderList();
    });
  });

  // 포커스 복원
  if(fInfo){
    const sel = `#list input[data-i="${fInfo.i}"][data-k="${fInfo.k}"]`;
    const el = document.querySelector(sel);
    if(el){ el.focus(); try{ el.setSelectionRange(fInfo.start, fInfo.end); }catch(_){} }
  }
}

/* ─────────────── 행동 ─────────────── */
function addPerson(){
  people.push({
    name:"",
    rate: $("defRate").value || "10320",
    hpd: $("defHpd").value || "8",
    applyWeekHoliday: false,
    days: new Set()
  });
  renderList();
}
function clearAll(){
  if(people.length===0) return;
  if(!confirm("전체 인원을 삭제할까요?")) return;
  people = []; renderList();
}

/* ─────────────── 엑셀 ─────────────── */
function exportXlsx(){
  const ym = $("ym").value;
  const last = ymLast(ym).getDate();
  const dayCols = Array.from({length:last}, (_,i)=>String(i+1));
  const data = [
    ["달력 일용직 급여 계산서"],
    ["계산 연월", ym, "기본 시급", $("defRate").value, "1일 시간", $("defHpd").value],
    [],
    ["#","이름","시급","1일시간","주휴수당적용","근무일수","실근로시간","주휴시간","합계시간","세전급여","소득세(3%)","지방세(0.3%)","공제합계","차인지급액", ...dayCols.map(d=>`${d}일`)]
  ];
  let sG=0,sI=0,sL=0,sD=0,sN=0;
  people.forEach((p,i)=>{
    const c = calcPerson(p);
    sG+=c.gross; sI+=c.incomeTax; sL+=c.localTax; sD+=c.deduct; sN+=c.net;
    const dayMarks = dayCols.map(d=>{
      const ds = `${ym}-${pad(d)}`;
      return p.days.has(ds) ? "O" : "";
    });
    data.push([
      i+1, p.name||"", Number(p.rate)||0, Number(p.hpd)||0,
      p.applyWeekHoliday ? "O":"",
      c.workDays, c.workHours, c.weekHoliday, c.totalHours,
      c.gross, c.incomeTax, c.localTax, c.deduct, c.net,
      ...dayMarks
    ]);
  });
  data.push(["","","","","","","","","합계", sG, sI, sL, sD, sN]);

  const ws = XLSX.utils.aoa_to_sheet(data);
  const baseCols = [{wch:4},{wch:10},{wch:9},{wch:7},{wch:11},{wch:8},{wch:10},{wch:9},{wch:9},{wch:12},{wch:11},{wch:11},{wch:11},{wch:13}];
  ws["!cols"] = [...baseCols, ...dayCols.map(()=>({wch:4}))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "달력급여");
  XLSX.writeFile(wb, `달력일용직_${ym}.xlsx`);
}
function importXlsx(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const arr = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      const meta = arr[1] || [];
      if(meta[1]) $("ym").value = String(meta[1]).slice(0,7);
      if(meta[3]) $("defRate").value = meta[3];
      if(meta[5]) $("defHpd").value = meta[5];
      const ym = $("ym").value;

      const hdrIdx = arr.findIndex(row => row && row[0]==="#" && String(row[1]).includes("이름"));
      if(hdrIdx<0) throw new Error("헤더 못 찾음");
      const hdr = arr[hdrIdx];
      const idx = name => hdr.findIndex(h => String(h).replace(/\s/g,"")===name);
      const iName=idx("이름"), iRate=idx("시급"), iHpd=idx("1일시간"), iAwh=idx("주휴수당적용");
      // 일자 컬럼 시작 위치: "1일" 헤더 인덱스
      const iDay1 = hdr.findIndex(h => /^1일$/.test(String(h).trim()));

      const newPeople = [];
      for(let i=hdrIdx+1; i<arr.length; i++){
        const row = arr[i];
        if(!row || row[0]==="") continue;
        if(row.some(c=>String(c)==="합계")) continue;
        if(!row[iName] && !row[iRate]) continue;
        const days = new Set();
        if(iDay1>=0){
          for(let d=0; d<31; d++){
            const v = row[iDay1+d];
            if(String(v).toUpperCase()==="O" || v===1 || v==="1"){
              const dd = d+1;
              days.add(`${ym}-${pad(dd)}`);
            }
          }
        }
        newPeople.push({
          name: String(row[iName]||""),
          rate: String(Number(row[iRate])||""),
          hpd: String(Number(row[iHpd])||"8"),
          applyWeekHoliday: String(row[iAwh]).toUpperCase()==="O",
          days
        });
      }
      people = newPeople;
      renderList();
      alert(`불러오기 완료: ${people.length}명`);
    }catch(err){
      alert("엑셀 불러오기 실패: "+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ─────────────── 초기화 ─────────────── */
function init(){
  $("ym").value = todayYM();
  $("ym").addEventListener("change", renderList);
  $("defRate").addEventListener("input", renderList);
  $("defHpd").addEventListener("input", renderList);

  $("addBtn").addEventListener("click", addPerson);
  $("addBtn2").addEventListener("click", addPerson);
  $("clearBtn").addEventListener("click", clearAll);
  $("expBtn").addEventListener("click", exportXlsx);
  $("printBtn").addEventListener("click", ()=>window.print());
  $("fileInput").addEventListener("change", e=>{
    if(e.target.files[0]) importXlsx(e.target.files[0]);
    e.target.value = "";
  });
  $("verBtn").addEventListener("click", ()=>{
    alert("업데이트 내역\n\n" + UPDATE_HISTORY.map(h=>`${h[0]} (${h[1]}) - ${h[2]}`).join("\n"));
  });

  renderList();
}
init();
window.addPerson = addPerson;

      if(e.data && e.data.type === "SW_FORCE_RELOAD") location.reload();
    });
  });
